<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; img-src 'self' data:;">
<style>
@font-face{font-family:'Poppins';font-weight:300;src:url(fonts/Poppins-Light.woff) format('woff')}
@font-face{font-family:'Poppins';font-weight:700;src:url(fonts/Poppins-Bold.woff) format('woff')}
*{margin:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#0a0510;font-family:'Poppins','Segoe UI',system-ui,sans-serif;-webkit-app-region:drag;user-select:none}
body{display:grid;place-items:center;background:radial-gradient(480px 260px at 50% 52%,#34163f 0,#0a0510 70%)}
#fx{position:fixed;inset:0;width:100%;height:100%}
.glow{position:absolute;width:380px;height:380px;border-radius:50%;filter:blur(80px);opacity:0;background:conic-gradient(#ffc53d,#ff6a1f,#e0338c,#7a2cff,#28b5f5,#ffc53d);animation:glow 2.6s .1s ease-out forwards,spin 14s linear infinite}
.mark{position:relative;text-align:center;color:#fff}
.mark img{width:470px;display:block;margin:0 auto;filter:drop-shadow(0 0 22px rgba(255,255,255,.35));animation:in 1.5s cubic-bezier(.2,.8,.2,1) both}
.line{display:block;height:2px;width:60%;margin:22px auto 0;background:linear-gradient(90deg,transparent,#ffc53d,#ff6a1f,#e0338c,transparent);transform-origin:center;animation:draw 1.3s .55s cubic-bezier(.6,0,.2,1) both}
.tag{margin-top:14px;font-weight:300;font-size:11px;letter-spacing:.5em;color:#a897b8;animation:in 1.2s 1.1s ease both}
@keyframes in{from{opacity:0;transform:translateY(10px);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
@keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes glow{to{opacity:.55}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style></head>
<body><canvas id="fx"></canvas><div class="glow"></div>
<div class="mark"><img src="studio-logo.png" alt="Sarex Studio"><i class="line"></i><p class="tag">LAUNCHER</p></div>
<script src="fx.js"></script></body></html>
